/* FisioAgenda 1.0. Base clara e fria; jade para ação; pinho escuro só no destaque do dia. */
:root{
  --ink:#0E1F1C;--mut:#55665F;--fraco:#8C9B97;
  --fundo:#F2F5F4;--card:#FFFFFF;--borda:#E3E9E7;--campo:#D3DCD9;--suave:#F7F9F8;
  --cor:#0D7A63;--cor-e:#095C4B;--cor-c:#E2F2EB;--cor-m:#BFE3D4;
  --pinho:#0C2A24;--menta:#86E3C3;
  --az:#2D6CB0;--az-c:#E8F0FA;--dan:#C0392B;--dan-c:#FCEDEB;--amb:#7D5300;--amb-c:#FFF5DF;--amb-b:#F2DFAE;--vd:#1C7A4A;--vd-c:#E3F4EA;
  --r:14px;--sombra:0 1px 2px rgba(14,31,28,.04),0 6px 16px -10px rgba(14,31,28,.12);
  --disp:"Inter Display",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--fundo);-webkit-font-smoothing:antialiased}
h1,h2,h3,.marca{font-family:var(--disp);font-weight:700;letter-spacing:-.015em}
h1{font-size:24px;margin:4px 0 14px;line-height:1.2}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:18px 0 8px}
:focus-visible{outline:3px solid var(--az);outline-offset:2px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--cor-e);text-underline-offset:3px}
.i{width:22px;height:22px;flex:none}
main{max-width:640px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* Topo */
.topo-app{position:sticky;top:0;z-index:40;margin:0 -16px 14px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px;background:rgba(242,245,244,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent}
.marca-l{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:34px;height:34px;flex:none;display:block}
.tt{min-width:0}.marca{font-size:19px;line-height:1.1;color:var(--ink)}.tit{display:none}
.quem-topo{font-size:12.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quem-topo small{font-size:12px;color:var(--fraco)}
.topo-icones{margin-left:auto;display:flex;gap:6px;flex:none}
.ico-topo{width:42px;height:42px;border-radius:12px;border:1px solid var(--borda);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}.ico-topo:hover{background:var(--suave)}.ico-topo svg{width:20px;height:20px}

/* Navegação: barra inferior no celular */
.abas{position:fixed;z-index:45;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--borda);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.abas button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border:0;background:none;color:var(--fraco);font-size:11.5px;font-weight:600;cursor:pointer}
.abas button .i{width:44px;height:30px;padding:4px 11px;border-radius:999px}
.abas button.ativa{color:var(--cor-e)}.abas button.ativa .i{background:var(--cor-c)}
.abas button.so-pc{display:none}

/* Cartões e listas */
.bloco{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:16px;margin-bottom:14px}
.topo-lista{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.topo-lista h2{margin:0}
ul.lista{list-style:none;padding:0;margin:0}ul.lista li{padding:12px 0;border-bottom:1px solid var(--borda);font-size:14px}ul.lista li:last-child{border-bottom:0;padding-bottom:2px}ul.lista small{color:var(--mut);display:block;overflow-wrap:anywhere;font-size:13px}
li.cons{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:start;cursor:pointer;border-radius:10px}
li.cons .h{font:600 16px/1.2 var(--disp);color:var(--ink);font-variant-numeric:tabular-nums}li.cons .h small{font:500 12px Inter,sans-serif;color:var(--fraco);margin-top:2px}
li.cons b{font-size:15px;font-weight:600}li.cons.canc{opacity:.55}
li.cons:hover,li.pac[data-a]:hover{background:var(--suave);box-shadow:-8px 0 0 var(--suave),8px 0 0 var(--suave)}
li.pac{display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer}li.pac>div{min-width:0;flex:1}li.pac b{font-size:15px;font-weight:600}
.avt{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:600 14px var(--disp);background:var(--cor-c);color:var(--cor-e)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:#EEF2F1;color:var(--mut)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.tag.confirmed,.tag.Ativo{background:var(--cor-c);color:var(--cor-e)}.tag.done{background:#EEF2F1;color:var(--mut)}.tag.cancelled,.tag.refused{background:var(--dan-c);color:var(--dan)}.tag.pending{background:var(--az-c);color:var(--az)}

/* Formulários */
label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px;color:var(--ink)}label .ob{color:var(--dan)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--campo);border-radius:10px;background:var(--card);min-height:46px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cor);box-shadow:0 0 0 4px var(--cor-c)}
textarea{min-height:84px;resize:vertical}input[type=checkbox]{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--cor)}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:12px}.linha>div,.ln3>div{min-width:0}.ln3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;font-weight:600;border-radius:12px;cursor:pointer;border:1px solid var(--campo);background:var(--card);white-space:nowrap;text-decoration:none;color:var(--ink);min-height:46px}.btn:hover{background:var(--suave)}
.btn.prim{background:var(--cor);border-color:var(--cor);color:#fff}.btn.prim:hover{background:var(--cor-e)}.btn.per{color:var(--dan);border-color:#EFC4BE}.btn.perf{background:var(--dan);border-color:var(--dan);color:#fff}.btn:disabled{opacity:.5;cursor:default}
.btn.wa{background:#E4F6EB;border-color:#B4E2C6;color:#146B3E}
.link{background:none;border:0;padding:0;font-size:14px;color:var(--cor-e);font-weight:600;cursor:pointer;text-decoration:none}.link:hover{text-decoration:underline}

let mesRel = hoje().slice(0, 7);
function dadosRel() {
  const cs = dados.consultas.filter((c) => c.data.slice(0, 7) === mesRel), por = {};
  cs.forEach((c) => { const k = c.pacienteId, r = (por[k] = por[k] || { nome: nomeP(k), feitas: 0, faltas: 0, canc: 0, tipos: {} });
    if (c.status === "done") { r.feitas++; r.tipos[tipoC(c)] = (r.tipos[tipoC(c)] || 0) + 1; }
    else if (c.status === "cancelled" && c.motivoCanc === "Paciente faltou") r.faltas++;
    else if (c.status === "cancelled") r.canc++; });
  return Object.values(por).filter((r) => r.feitas || r.faltas || r.canc).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
}

let cepAtual = "";
async function buscarCep(v) {
  const d = v.replace(/\D/g, ""), msg = $("cepMsg"); if (d.length !== 8 || d === cepAtual || DEMO) return;
  cepAtual = d; msg.textContent = "Buscando endereço...";
  try {
    const r = await (await fetch(`https://viacep.com.br/ws/${d}/json/`)).json();
    if (!$("i_cep") || cepAtual !== d) return;
    if (r.erro) { msg.textContent = "CEP não encontrado. Preencha o endereço."; return; }
    [["i_rua", r.logradouro], ["i_bairro", r.bairro], ["i_cidade", r.localidade], ["i_uf", r.uf]].forEach(([id, val]) => { if (val && !$(id).value.trim()) $(id).value = val; });
    msg.textContent = "Endereço preenchido. Confira e informe o número."; $("i_numero").focus();
  } catch (e) { if ($("cepMsg")) msg.textContent = "Não foi possível buscar o CEP. Preencha o endereço."; }
}

        if (ch.erro) return rej.push({ data: o.data, txt: ch.erro });
        if (ch.avisos.some((a) => a.startsWith("Fora"))) return rej.push({ data: o.data, txt: "Fora do seu horário de atendimento." });
        const a = `${o.hora}`; Object.assign(o, { hora: v.hora, duracao: dur, endereco: v.endereco, obs: v.obs, tipo: v.tipo }); hist(o, `Editada na série: de ${a} para ${v.hora}`); ok++; });
      const s = dados.series.find((x) => x.id === c.serieId); Object.assign(s.regra, { startTime: v.hora, durationMinutes: dur }); s.endereco = v.endereco; s.tipo = v.tipo;
      gravar(); atualizarTudo(); return relSerie("Série atualizada", ok, rej, "atualizada");

    if (c) { const a = `${dCurta(c.data)} ${c.hora}`; Object.assign(c, { data: v.data, hora: v.hora, duracao: dur, endereco: v.endereco, obs: v.obs, tipo: v.tipo }); hist(c, a === `${dCurta(c.data)} ${c.hora}` ? "Dados editados" : `Reagendada: de ${a} para ${dCurta(c.data)} ${c.hora}`); }
    else { const n = { id: uid(), pacienteId: v.p, data: v.data, hora: v.hora, duracao: dur, endereco: v.endereco, obs: v.obs, tipo: v.tipo, status: "confirmed", hist: [], criadoEm: agoraISO() }; hist(n, "Criada manualmente"); dados.consultas.push(n); }
